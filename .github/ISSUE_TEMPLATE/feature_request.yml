name: Feature request
description: Propose a capability.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API, command or behavior you would like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
