[package]
name = "agent-capability-token"
description = "Canonical wire format for the Agent Capability Token (ACT) required by ANVIL section 5."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["capability", "token", "cbor", "ed25519", "authorization"]
categories = ["cryptography", "authentication", "encoding"]

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# Signing requires holding a private key. Verifiers - the dependency-sensitive
# side, typically sidecars and off-path workers - do not need it.
sign = []

[lints]
workspace = true

[dev-dependencies]
# A dev-dependency on this crate enables `sign` for the test targets without
# making it a default for library consumers. The conformance suite has to mint
# tokens in order to check that they verify, so it needs the signing half even
# though a verifier does not.
agent-capability-token = { path = ".", features = ["sign"] }
# Tests build keys from fixed seeds and assemble envelopes directly.
ed25519-dalek = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
